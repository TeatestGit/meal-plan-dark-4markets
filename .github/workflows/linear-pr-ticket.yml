name: Create Linear ticket on PR

on:
  pull_request:
    types: [opened]

jobs:
  create-linear-issue:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Linear issue and comment on PR
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ secrets.LINEAR_TEAM_KEY }}
          LINEAR_PROJECT_NAME: ${{ secrets.LINEAR_PROJECT_NAME }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GIT_AUTH: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          from scripts.linear_helpers import create_linear_issue

          issue = create_linear_issue(
              os.environ["LINEAR_API_KEY"],
              os.environ["LINEAR_TEAM_KEY"],
              os.environ["LINEAR_PROJECT_NAME"],
              os.environ["PR_TITLE"],
              f"GitHub PR #{os.environ['PR_NUMBER']}: {os.environ['PR_URL']}\n\n{os.environ.get('PR_BODY', '')}",
              fail_on_error=True,
          )

          if issue is None:
              raise SystemExit(0)

          issue_id = issue["identifier"]
          issue_url = issue["url"]

          git_auth = os.environ["GIT_AUTH"]
          authorization = "Bearer " + git_auth
          comment_payload = json.dumps({"body": f"🔗 Linear issue created: [{issue_id}]({issue_url})"}).encode("utf-8")
          comment_request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",
              data=comment_payload,
              headers={
                  "Authorization": authorization,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(comment_request, timeout=30) as response:
                  print(f"GitHub comment created: {response.status}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"Warning: GitHub PR comment failed ({exc.code}): {body}", file=sys.stderr)
          PY
