name: Create Linear ticket on PR

on:
  pull_request:
    types: [opened]

jobs:
  create-linear-issue:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create Linear issue and comment on PR
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ secrets.LINEAR_TEAM_KEY }}
          LINEAR_PROJECT_NAME: ${{ secrets.LINEAR_PROJECT_NAME }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Resolve team key (e.g. "ENG") to UUID
          TEAM_RESP=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"{ teams { nodes { id key } } }\"}")
          TEAM_ID=$(echo "$TEAM_RESP" | python3 -c "
import sys, json
nodes = json.load(sys.stdin)['data']['teams']['nodes']
match = next(n for n in nodes if n['key'] == '$LINEAR_TEAM_KEY')
print(match['id'])
")

          # Resolve project name to UUID
          PROJECT_RESP=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"query\": \"{ projects { nodes { id name } } }\"}")
          PROJECT_ID=$(echo "$PROJECT_RESP" | python3 -c "
import sys, json, os
nodes = json.load(sys.stdin)['data']['projects']['nodes']
name = os.environ['LINEAR_PROJECT_NAME'].lower()
match = next(n for n in nodes if n['name'].lower() == name)
print(match['id'])
")

          RESPONSE=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"query\": \"mutation CreateIssue(\$teamId: String!, \$projectId: String, \$title: String!, \$description: String) { issueCreate(input: { teamId: \$teamId, projectId: \$projectId, title: \$title, description: \$description }) { success issue { id identifier url } } }\",
              \"variables\": {
                \"teamId\": \"$TEAM_ID\",
                \"projectId\": \"$PROJECT_ID\",
                \"title\": \"$PR_TITLE\",
                \"description\": \"GitHub PR #$PR_NUMBER: $PR_URL\n\n$PR_BODY\"
              }
            }")

          ISSUE_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['issueCreate']['issue']['url'])")
          ISSUE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['issueCreate']['issue']['identifier'])")

          curl -s -X POST "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"🔗 Linear issue created: [$ISSUE_ID]($ISSUE_URL)\"}"
