name: Create Linear ticket on PR

on:
  pull_request:
    types: [opened, reopened]

jobs:
  create-linear-issue:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Linear issue and comment on PR
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_PROJECT_NAME: ${{ secrets.LINEAR_PROJECT_NAME }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GIT_AUTH: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: PYTHONPATH=. python3 scripts/create_linear_ticket.py
